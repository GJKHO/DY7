        html {
            width: 100%;
            height: 100%;
            font-size: 18px;
            scroll-behavior: smooth;
            font-family: Segoe UI Historic, Segoe UI, Helvetica, Arial, sans-serif;
            background-color: #191919;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            color: white;
            background: transparent;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
            position: absolute;
            background-color: #181818;
            /* background-image: url(./assets/svgs/background.svg); */
        }

        canvas {
        max-height: 92%;
        max-width: 100%;
        /* object-fit: contain; */
        /* position: relative; */
        /* transform: translate(-50%, -50%);
        left: 50%;
        top: 50%; */
        box-shadow: rgb(0 0 0 / 10%) 0px 0px 16px 16px;

        bottom:8%;height:auto;width:100%;display:block
        }

        #capture {
            display: none;
        }

        #lds-dual-ring {
            display: block;
            width: 64px;
            height: 64px;
            margin: 0px auto;
            border-radius: 50%;
            border: 6px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
            -webkit-animation: lds-dual-ring 1.2s linear infinite;
        }

        #lds-text {
            text-align: center;
            -webkit-text-align: center;
            margin-top: 30px;
            font-size: 1.2rem;
        }

        #lds-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            -webkit-transform: translate(-50%, -50%);
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        div[hidden] {
            display: none !important;
        }

                        return id;

                            if (keys && Array.isArray(keys)) {
                                var res = {}; keys.forEach(function (k) { res[k] = data[k]; }); return Promise.resolve(res);
                            }
                            return Promise.resolve(data);
                        } catch (e) { return Promise.resolve({}); }
                    },
                    setDataAsync: function (data) {
                        try {
                            var ex = JSON.parse(localStorage.getItem('__game_data') || '{}');
                            localStorage.setItem('__game_data', JSON.stringify(Object.assign(ex, data)));
                        } catch (e) { }
                        return Promise.resolve();
                    },
                    flushDataAsync: function () { return Promise.resolve(); },
                    getStatsAsync: function (keys) {
                        try {
                            var stats = JSON.parse(localStorage.getItem('__game_stats') || '{}');
                            if (keys && Array.isArray(keys)) {
                                var res = {}; keys.forEach(function (k) { res[k] = stats[k]; }); return Promise.resolve(res);
                            }
                            return Promise.resolve(stats);
                        } catch (e) { return Promise.resolve({}); }
                    },
                    setStatsAsync: function (data) {
                        try {
                            var ex = JSON.parse(localStorage.getItem('__game_stats') || '{}');
                            localStorage.setItem('__game_stats', JSON.stringify(Object.assign(ex, data)));
                        } catch (e) { }
                        return Promise.resolve();
                    },
                    incrementStatsAsync: function (data) {

                    matchPlayerAsync: function () { return Promise.reject(new Error('Unsupported')); },
                    checkCanPlayerMatchAsync: function () { return Promise.reject(false); },
                    postSessionScoreAsync: function () { return Promise.resolve(); },
